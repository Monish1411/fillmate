name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, lint & build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Verify migrations are in sync with the schema
        run: |
          npm run gen:migrations
          if ! git diff --quiet -- supabase/migrations/0001_core_schema.sql; then
            echo "::error::0001_core_schema.sql is out of date. Run: npm run gen:migrations"
            git --no-pager diff -- supabase/migrations/0001_core_schema.sql
            exit 1
          fi
          echo "Migrations are in sync."

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Migrations run on a real Postgres
        run: |
          docker run --rm -d --name fillmate-db \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=fillmate \
            -p 5432:5432 postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec fillmate-db pg_isready -U postgres -d fillmate && break
            sleep 1
          done
          npm run db:setup
          echo "Postgres migrations applied successfully."

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          retention-days: 3